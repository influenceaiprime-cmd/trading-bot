name: trading-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install python-binance pandas python-dotenv requests

      - name: Run one cycle
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot_engine_v5.py --once

      - name: Commit state back
        run: |
          git config user.name "bot-runner"
          git config user.email "bot@github.com"
          git add bot_state.json || true
          git diff --staged --quiet || git commit -m "state update"
          git push

4. Commit changes → Commit to main
